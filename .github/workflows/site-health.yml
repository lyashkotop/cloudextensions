name: Check CloudStream sources

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      selection:
        description: Providers to check
        type: choice
        options:
          - focused
          - all
        default: focused
      samples:
        description: Cards to check per provider (1–10)
        type: number
        default: 2

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tools
          key: cloudextensions-site-health-${{ runner.os }}-${{ hashFiles('common/tools/*toolchain.json') }}
      - name: Fetch verified tools
        run: |
          python common/tools/fetch_tools.py --directory .tools
          python common/tools/fetch_tools.py --directory .tools --manifest common/tools/probe-toolchain.json
      - name: Check site responses
        env:
          SELECTION: ${{ inputs.selection || 'focused' }}
          SAMPLES: ${{ inputs.samples || 2 }}
        run: python scripts/check_sites.py --selection "$SELECTION" --samples "$SAMPLES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudstream-site-health
          path: .release/site-health.json
          retention-days: 14

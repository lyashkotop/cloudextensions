name: Build Aniyomi bundle
on:
  push:
    branches: [main]
    paths:
      - 'Aniyomi/**'
      - '.github/workflows/aniyomi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .aniyomi-tools
          key: aniyomi-${{ runner.os }}-${{ hashFiles('common/tools/toolchain.json', 'Aniyomi/scripts/toolchain.json') }}
      - name: Fetch verified tools
        run: |
          python common/tools/fetch_tools.py --directory .aniyomi-tools/compiler
          python Aniyomi/scripts/fetch_tools.py --directory .aniyomi-tools/android
      - name: Build and validate APK
        env:
          ANIYOMI_KEYSTORE_DATA: ${{ secrets.ANIYOMI_KEYSTORE }}
          ANIYOMI_KEYSTORE_PASSWORD: ${{ secrets.ANIYOMI_KEYSTORE_PASSWORD }}
          ANIYOMI_KEYSTORE: ${{ runner.temp }}/aniyomi-release.jks
        run: |
          python Aniyomi/scripts/ci_build.py --tools .aniyomi-tools/android --compiler-tools .aniyomi-tools/compiler --version ${{ github.run_number }}
          python Aniyomi/scripts/check.py --tools .aniyomi-tools/android --compiler-tools .aniyomi-tools/compiler
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aniyomi-bundle
          path: |
            Aniyomi/build/*.apk
            Aniyomi/build/build-info.json
            Aniyomi/build/apk-manifest.txt
